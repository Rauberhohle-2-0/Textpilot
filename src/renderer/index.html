<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Textpilot</title>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <!-- Liquid-glass refraction filter for the footer buttons: turbulence
       displaces the backdrop behind the pill/circles so content warps
       through them like a lens. Referenced as url(#textpilot-glass) in
       the backdrop-filter chain (with a plain-blur fallback line before
       it for renderers without SVG-in-backdrop support). Kept in the
       DOM with zero size rather than display:none, which would break
       the reference in some renderers. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter
          id="textpilot-glass"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >
          <feTurbulence
            type="turbulence"
            baseFrequency="0.02"
            numOctaves="3"
            seed="2"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="20"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
  </body>
</html>
