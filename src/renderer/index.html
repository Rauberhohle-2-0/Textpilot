<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Defence in depth behind the markdown sanitizer: even if a
         payload survived the allowlist it could not load a script or
         send data anywhere. `unsafe-inline` styles are Tailwind's
         runtime injection; connect-src stays on loopback because that
         is the only network this app may touch (vantail.config.ts) and
         the dev server's HMR socket lives there too. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Textpilot</title>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <!-- Liquid-glass refraction filter for the footer buttons: turbulence
       displaces the backdrop behind the pill/circles so content warps
       through them like a lens. Referenced as url(#textpilot-glass) in
       the backdrop-filter chain (with a plain-blur fallback line before
       it for renderers without SVG-in-backdrop support). Kept in the
       DOM with zero size rather than display:none, which would break
       the reference in some renderers. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter
          id="textpilot-glass"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >
          <feTurbulence
            type="turbulence"
            baseFrequency="0.015"
            numOctaves="2"
            seed="2"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="6"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
  </body>
</html>
